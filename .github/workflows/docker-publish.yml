name: Publish image

on:
  push:
    branches: [main]
    paths:
      - "zh/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: publish-image
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npm test

      - name: Read pinned upstream version
        id: upstream
        run: |
          echo "tag=$(jq -r .version zh/upstream.json)" >> "$GITHUB_OUTPUT"
          echo "base=$(jq -r .baseImage zh/upstream.json)" >> "$GITHUB_OUTPUT"

      - name: Download upstream source
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/upstream
          curl -fsSL "https://github.com/C4illin/ConvertX/archive/refs/tags/${TAG}.tar.gz" \
            | tar -xz --strip-components=1 -C /tmp/upstream

      - name: Apply translations and patches
        run: |
          node zh/apply.mjs /tmp/upstream --strict \
            --source-url "https://github.com/${{ github.repository }}"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.upstream.outputs.tag }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.upstream.outputs.tag }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: /tmp/upstream
          file: ${{ github.workspace }}/zh/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ steps.upstream.outputs.base }}
            SOURCE_URL=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Package corresponding source
        run: |
          set -euo pipefail
          mkdir -p source/convertx
          rsync -a \
            --exclude node_modules \
            --exclude dist \
            --exclude .git \
            /tmp/upstream/ source/convertx/
          cp -a zh source/convertx/convertx-zh-overlay
          cp LICENSE NOTICE.md source/convertx/
          cp README.md source/convertx/CONVERTX-ZH-README.md
          tar -czf "convertx-zh-${{ steps.upstream.outputs.tag }}-source.tar.gz" \
            -C source convertx

      - name: Publish source archive
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.upstream.outputs.tag }}-zh
          name: ConvertX 中文版 ${{ steps.upstream.outputs.tag }}
          body: |
            基于上游 [C4illin/ConvertX](https://github.com/C4illin/ConvertX) `${{ steps.upstream.outputs.tag }}` 的简体中文汉化版。

            - 镜像：`${{ steps.image.outputs.name }}:${{ steps.upstream.outputs.tag }}`
            - 源码：本仓库 + 本 Release 附件中的对应源码归档
            - 许可：AGPL-3.0
          files: convertx-zh-*-source.tar.gz
          fail_on_unmatched_files: true
